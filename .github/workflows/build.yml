name: Dragon Court
run-name: Build
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The toolchain always compiles to Java 17; this checks the build itself still
        # runs on newer JDKs, including the one that dropped the Applet API.
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew spotlessCheck build webDist

      - if: matrix.java == '17'
        uses: actions/upload-artifact@v4
        with:
          name: RustyDagger-web
          path: build/web/

  # The TypeScript rewrite. Unlike the Java side, which is gated on formatting alone,
  # this has type checking, linting, formatting and tests from its first commit --
  # see docs/roadmap.md, Phase 1.
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  # The exported content is generated from the Java build, so it can go stale silently.
  # Regenerating it in CI and diffing catches that.
  content-is-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew exportContent
      - run: git diff --exit-code content/
