<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dragon Court</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <header class="toolbar">
      <span class="toolbar__title">Dragon Court</span>
      <span class="toolbar__spacer"></span>
      <button id="export-save" type="button" title="Download this character as a .hero file">
        Save a copy
      </button>
      <button id="load-save" type="button" title="Open a .hero file from this computer">
        Load a character
      </button>
      <input id="load-file" type="file" accept=".hero,text/plain" hidden />
      <button id="new-game" type="button" title="Abandon this character and start again">
        New character
      </button>
    </header>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
