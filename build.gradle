plugins {
    id 'java'
    id 'application'
    id "com.diffplug.spotless" version "8.10.1"
}

repositories {
    mavenCentral()
}

// Java 17 bytecode. It is the newest level CheerpJ can run (see web/README.md), and
// every JDK from 17 up can still target it -- including JDK 26, which dropped the
// Applet API this game used to depend on.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    // The game is a 1997 AWT applet: deprecation noise is expected and not actionable.
    options.compilerArgs << '-Xlint:-deprecation,-removal'
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'DCourt.DCourtFrame'
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java/'
        }
        resources {
            // Art is addressed from the classpath root, e.g. "Faces/Hero.jpg".
            srcDir 'Images/'
        }
    }
}

jar {
    manifest {
        attributes('Main-Class': application.mainClass)
    }
}

spotless {
    java {
        googleJavaFormat()
    }
}

// Assembles the browser build: the same jar, plus a page that boots it under CheerpJ.
// Serve build/web over HTTP (CheerpJ needs a real origin, file:// will not work).
tasks.register('webDist', Copy) {
    group = 'distribution'
    description = 'Builds the CheerpJ browser distribution into build/web'
    into layout.buildDirectory.dir('web')
    from(jar)
    from('web')
    rename { it == jar.archiveFileName.get() ? 'RustyDagger.jar' : it }
}
