plugins {
    id 'java'
    id 'application'
    id "com.diffplug.spotless" version "8.10.1"
}

repositories {
    mavenCentral()
}

// Java 17 bytecode. It is the newest level CheerpJ can run (see web/README.md), and
// every JDK from 17 up can still target it -- including JDK 26, which dropped the
// Applet API this game used to depend on.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    // The game is a 1997 AWT applet: deprecation noise is expected and not actionable.
    options.compilerArgs << '-Xlint:-deprecation,-removal'
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'DCourt.DCourtFrame'
}

// ./gradlew run -Pscale=3  -- saves spelling out the -D every time.
tasks.named('run') {
    if (project.hasProperty('scale')) {
        systemProperty 'dragoncourt.scale', project.property('scale')
    }
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java/'
        }
        resources {
            // Art is addressed from the classpath root, e.g. "Faces/Hero.jpg".
            srcDir 'Images/'
        }
    }
}

// The characterisation harness: records how the Java build actually behaves, so the
// TypeScript port can be diffed against it. Its own source set, so nothing here ships
// in the game jar. See docs/development.md.
sourceSets {
    harness {
        java {
            srcDir 'src/harness/java'
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output + sourceSets.main.resources.sourceDirectories
    }
}

tasks.register('baseline', JavaExec) {
    group = 'verification'
    description = 'Records the parity baseline into baseline/baseline.txt'
    mainClass = 'DCourt.Harness.Baseline'
    classpath = sourceSets.harness.runtimeClasspath
    systemProperty 'java.awt.headless', 'true'
    if (project.hasProperty('out')) {
        args project.property('out')
    }
}

jar {
    manifest {
        attributes('Main-Class': application.mainClass)
    }
}

spotless {
    java {
        googleJavaFormat()
    }
}

// Assembles the browser build: the same jar, plus a page that boots it under CheerpJ.
// Serve build/web over HTTP (CheerpJ needs a real origin, file:// will not work).
tasks.register('webDist', Copy) {
    group = 'distribution'
    description = 'Builds the CheerpJ browser distribution into build/web'
    into layout.buildDirectory.dir('web')
    from(jar)
    from('web')
    rename { it == jar.archiveFileName.get() ? 'RustyDagger.jar' : it }
}
